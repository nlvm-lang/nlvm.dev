<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Source of truth for the social preview. Render with `make social`.
       Palette, type and logo follow private/NL Brand Guidelines: flat
       background, no glow, square stroke caps, jade as the only accent. -->

  <rect width="1280" height="640" fill="#0a0f0c"/>

  <!-- Mark — nl_logo.svg scaled 0.5, unmodified geometry -->
  <g transform="translate(214 192) scale(0.5)">
    <rect width="512" height="512" rx="40" fill="#0a0f0c"/>
    <rect x="6" y="6" width="500" height="500" rx="36" fill="none" stroke="#263832" stroke-width="6"/>
    <g fill="none" stroke="#35C99B" stroke-width="44" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M160 364 V224 L196 190 L244 190 L280 224 V364"/>
      <path d="M360 364 V128"/>
    </g>
  </g>

  <!-- Type block. Origin sits on the top-left corner of the mark's visible
       border, so every y below reads as a distance from the top of the box:
         12.875  eyebrow cap height   -> its cap line is flush with the box top
        253      box height           -> the last baseline sits on the box bottom
       The two middle baselines follow from the ink gaps 38 / 55.375 / 28.
       Box top = 192 + (6 - 3) * 0.5 = 193.5, box height = 506 * 0.5 = 253. -->
  <g transform="translate(534 193.5)">
    <text x="0" y="12.875"
          font-family="'IBM Plex Mono', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace"
          font-size="18" font-weight="500" letter-spacing="3.24" fill="#35C99B">THE NL PROGRAMMING LANGUAGE</text>

    <text x="0" y="127.875"
          font-family="'IBM Plex Mono', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace"
          font-size="104" font-weight="700"><tspan fill="#E7EEEA">nl</tspan><tspan fill="#5F7370">vm</tspan><tspan fill="#35C99B">_</tspan></text>

    <g font-family="'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
      <text x="0" y="208.625" font-size="34" font-weight="600" fill="#E7EEEA">The compiler is on your side.</text>
      <text x="0" y="253" font-size="22" font-weight="400" fill="#93A69E">Null safety, checked exceptions, exhaustive matching.</text>
    </g>
  </g>
</svg>
